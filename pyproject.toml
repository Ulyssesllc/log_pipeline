[project] 
name = "log-pipeline" 
version = "0.1.0" 
description = "Automated Shell and Python Log Processing Pipeline" 
readme = "README.md" 
requires-python = ">=3.10" 
dependencies = [ "pandas>=2.0.0", ] 

[tool.ruff] 
line-length = 88 
select = ["E", "F", "I"] 

[tool.mypy] 
python_version = "3.10" 
warn_return_any = true 
warn_unused_configs = true
